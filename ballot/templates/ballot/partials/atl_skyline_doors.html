{% load static %}

<div id="atlSkylineEntrance" class="atl-skyline-entrance">
  <div class="atl-door-stage">

    <div class="atl-door atl-door-left">
      <picture>
        <source
          media="(max-width: 768px)"
          srcset="{% static 'ballot/img/atl_skyline_doors_mobile.png' %}"
        >
        <img
          class="atl-door-art atl-door-art-left"
          src="{% static 'ballot/img/atl_skyline_doors.png' %}"
          alt=""
          aria-hidden="true"
        >
      </picture>
    </div>

    <div class="atl-door atl-door-right">
      <picture>
        <source
          media="(max-width: 768px)"
          srcset="{% static 'ballot/img/atl_skyline_doors_mobile.png' %}"
        >
        <img
          class="atl-door-art atl-door-art-right"
          src="{% static 'ballot/img/atl_skyline_doors.png' %}"
          alt=""
          aria-hidden="true"
        >
      </picture>
    </div>

    <div class="atl-door-seam"></div>


  </div>
</div>

<style>
html.atl-entrance-active,
html.atl-entrance-active body {
  overflow: hidden !important;
}

.atl-skyline-entrance {
  position: fixed;
  inset: 0;
  z-index: 999999;
  background: #000;
  perspective: 2200px;
  overflow: hidden;
  opacity: 1;
  visibility: visible;
  transition: opacity .8s ease, visibility .8s ease;
}

.atl-skyline-entrance.atl-entrance-finished {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.atl-door-stage {
  position: absolute;
  inset: 0;
  overflow: hidden;
  transform-style: preserve-3d;
}

.atl-door {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 50%;
  overflow: hidden;
  transform-style: preserve-3d;
  backface-visibility: hidden;
  will-change: transform;
  transition: transform 4s cubic-bezier(.72,.02,.18,1);
}

.atl-door-left {
  left: 0;
  transform-origin: left center;
}

.atl-door-right {
  right: 0;
  transform-origin: right center;
}

.atl-door-art {
  position: absolute;
  top: 0;
  height: 100vh;
  width: 100vw;
  max-width: none;
  object-fit: fill;
  object-position: center top;
  display: block;
  pointer-events: none;
}

.atl-door-art-left {
  left: 0;
}

.atl-door-art-right {
  right: 0;
}

.atl-door-seam {
  position: absolute;
  z-index: 8;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 3px;
  transform: translateX(-50%);
  background: #ffd76a;
  box-shadow:
    0 0 8px rgba(255,240,190,1),
    0 0 24px rgba(255,195,45,.95),
    0 0 50px rgba(210,25,25,.48);
  animation: atlDoorGlow 1.8s ease-in-out infinite;
  transition: opacity .5s ease;
}

@keyframes atlDoorGlow {
  0%,100% {
    box-shadow:
      0 0 6px rgba(255,220,120,.9),
      0 0 18px rgba(255,190,40,.7),
      0 0 34px rgba(190,20,20,.28);
  }

  50% {
    box-shadow:
      0 0 10px rgba(255,250,215,1),
      0 0 32px rgba(255,205,70,1),
      0 0 58px rgba(220,30,30,.55);
  }
}

.atl-door-brand {
  position: absolute;
  z-index: 12;
  left: 50%;
  top: 10%;
  transform: translateX(-50%);
  width: min(92vw, 900px);
  text-align: center;
  pointer-events: none;
  transition: opacity .6s ease, transform .6s ease;
}

.atl-door-brand-name {
  color: #fff;
  font-family: "Playfair Display", Georgia, serif;
  font-size: clamp(2rem, 5vw, 4.8rem);
  font-weight: 800;
  letter-spacing: .08em;
  text-shadow:
    0 0 4px #fff,
    0 0 16px rgba(255,215,106,.8),
    0 0 34px rgba(180,20,20,.35);
}

.atl-door-brand-line {
  margin-top: 8px;
  color: #ffd76a;
  font-family: "Montserrat", Arial, sans-serif;
  font-size: clamp(.72rem, 1.5vw, 1rem);
  font-weight: 800;
  letter-spacing: .2em;
}

.atl-door-enter {
  position: absolute;
  z-index: 14;
  left: 50%;
  bottom: 7%;
  transform: translateX(-50%);
  padding: 12px 30px;
  border: 1px solid rgba(255,215,106,.85);
  border-radius: 999px;
  background: rgba(0,0,0,.68);
  color: #fff;
  font-family: "Montserrat", Arial, sans-serif;
  font-size: .78rem;
  font-weight: 900;
  letter-spacing: .22em;
  cursor: pointer;
  box-shadow: 0 0 18px rgba(255,195,45,.28);
  transition: opacity .5s ease, transform .25s ease;
}

.atl-door-enter:hover {
  transform: translateX(-50%) scale(1.05);
}

.atl-skyline-entrance.atl-opening .atl-door-left {
  transform: rotateY(-108deg);
}

.atl-skyline-entrance.atl-opening .atl-door-right {
  transform: rotateY(108deg);
}

.atl-skyline-entrance.atl-opening .atl-door-seam,
.atl-skyline-entrance.atl-opening .atl-door-enter {
  opacity: 0;
}

.atl-skyline-entrance.atl-opening .atl-door-brand {
  opacity: 0;
  transform: translateX(-50%) translateY(-18px);
}

@media (max-width: 760px) {
  .atl-door-brand {
    top: 8%;
    width: calc(100vw - 30px);
  }

  .atl-door-brand-name {
    font-size: clamp(2rem, 10vw, 3.3rem);
    line-height: 1;
  }

  .atl-door-brand-line {
    font-size: .64rem;
    line-height: 1.5;
  }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const entrance = document.getElementById("atlSkylineEntrance");
  const button = document.getElementById("atlDoorEnter");

  if (!entrance) return;

  function finishEntrance() {
    entrance.classList.add("atl-entrance-finished");
    document.documentElement.classList.remove("atl-entrance-active");

    setTimeout(function () {
      entrance.remove();
    }, 900);
  }

  function openDoors() {
    if (entrance.classList.contains("atl-opening")) return;

    entrance.classList.add("atl-opening");

    setTimeout(finishEntrance, 1550);
  }

  document.documentElement.classList.add("atl-entrance-active");

  if (button) {
    button.addEventListener("click", openDoors);
  }

  setTimeout(openDoors, 2200);
});
</script>

   The doors continue opening independently. */
document.addEventListener("DOMContentLoaded", function () {
  const entrance = document.getElementById("atlSkylineEntrance");

  if (!entrance) return;

  const observer = new MutationObserver(function () {
    if (!entrance.classList.contains("atl-opening")) return;

    setTimeout(function () {
      entrance.classList.add("atl-beam-finished");
    }, 1500);

    observer.disconnect();
  });

  observer.observe(entrance, {
    attributes: true,
    attributeFilter: ["class"]
  });
});
</script>
