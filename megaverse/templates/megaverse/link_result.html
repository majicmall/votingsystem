<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | ATL's Hottest</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at top, rgba(212, 175, 55, 0.14), transparent 38%),
                #050505;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .panel {
            width: min(560px, 100%);
            padding: 38px 30px;
            border: 1px solid rgba(212, 175, 55, 0.48);
            border-radius: 22px;
            background: rgba(10, 10, 10, 0.88);
            box-shadow:
                0 24px 70px rgba(0, 0, 0, 0.55),
                0 0 32px rgba(212, 175, 55, 0.08);
            text-align: center;
        }

        .eyebrow {
            margin-bottom: 12px;
            color: #d4af37;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 18px;
            font-size: clamp(1.8rem, 5vw, 2.6rem);
        }

        p {
            margin: 0 auto 28px;
            max-width: 450px;
            color: #dddddd;
            line-height: 1.65;
        }

        .status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 120px;
            margin-bottom: 22px;
            padding: 9px 16px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .status.success {
            background: rgba(212, 175, 55, 0.13);
            border: 1px solid rgba(212, 175, 55, 0.55);
            color: #f1d36d;
        }

        .status.error {
            background: rgba(190, 40, 40, 0.15);
            border: 1px solid rgba(255, 100, 100, 0.4);
            color: #ffb3b3;
        }

        .button {
            display: inline-block;
            padding: 14px 22px;
            border: 1px solid #d4af37;
            border-radius: 12px;
            background: linear-gradient(135deg, #d4af37, #f2d675);
            color: #090909;
            font-weight: 900;
            text-decoration: none;
        }

        .signature {
            margin-top: 24px;
            color: #aaa;
            font-size: 0.78rem;
        }
    </style>
</head>

<body>
    <main class="panel">
        <div class="eyebrow">ATL's Hottest × MajicMall Megaverse</div>

        {% if success %}
            <div class="status success">Connected</div>
        {% else %}
            <div class="status error">Not Connected</div>
        {% endif %}

        <h1>{{ title }}</h1>

        <p>{{ message }}</p>

        {% if success %}
            <a class="button" href="/association/dashboard/">
                Continue to ATL's Hottest
            </a>
        {% else %}
            <a class="button" href="{% url 'megaverse:link_start' %}">
                Try Again
            </a>
        {% endif %}

        <div class="signature">
            One ATL's Hottest. Multiple entrances. One connected world.
        </div>
    </main>
</body>
</html>
