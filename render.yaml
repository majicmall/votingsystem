services:
  - type: web
    name: atlshottestawards
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn atl_ballot.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.1"
      - key: DATABASE_URL
        fromDatabase:
          name: atlshottestawards-db
          property: connectionString


  # ------------------------------------------------------------
  # AMBE — Automated Media Buying Engine
  #
  # Wake AMBE every 30 minutes.
  # AMBE looks ahead 60 minutes, processes at most 25 active
  # campaigns per pass, and uses the H3B-4A five-minute safety
  # lease for defense-in-depth concurrency protection.
  # ------------------------------------------------------------
  - type: cron
    name: ambe-media-buying-engine
    runtime: python
    plan: 0.5c-512mb
    schedule: "*/30 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: >-
      python manage.py run_advertising_shopper
      --lookahead-minutes 60
      --campaign-limit 25
      --lease-seconds 300
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        fromService:
          type: web
          name: atlshottestawards
          envVarKey: SECRET_KEY
      - key: PYTHON_VERSION
        value: "3.12.1"
      - key: DATABASE_URL
        fromDatabase:
          name: atlshottestawards-db
          property: connectionString

databases:
  - name: atlshottestawards-db
    plan: free
